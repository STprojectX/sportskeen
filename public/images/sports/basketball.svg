<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a1a00"/>
      <stop offset="100%" style="stop-color:#5a2800"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c87820"/>
      <stop offset="100%" style="stop-color:#a05c10"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Court floor -->
  <rect x="60" y="300" width="1080" height="260" fill="url(#floor)"/>
  <!-- Floor lines -->
  <rect x="60" y="300" width="1080" height="260" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <!-- Half-court -->
  <line x1="600" y1="300" x2="600" y2="560" stroke="white" stroke-width="3" opacity="0.8"/>
  <!-- Centre circle -->
  <circle cx="600" cy="430" r="80" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <circle cx="600" cy="430" r="6" fill="white" opacity="0.8"/>
  <!-- Left three-point arc -->
  <path d="M 60 340 L 220 340 L 220 520 L 60 520" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <path d="M 220 340 Q 400 430 220 520" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <!-- Left key/paint -->
  <rect x="60" y="360" width="160" height="160" fill="#8a2a00" opacity="0.6"/>
  <rect x="60" y="360" width="160" height="160" fill="none" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <!-- Left basket -->
  <rect x="58" y="420" width="20" height="6" fill="#888"/>
  <circle cx="88" cy="423" r="22" fill="none" stroke="#ff6600" stroke-width="5"/>
  <!-- Left backboard -->
  <rect x="40" y="390" width="10" height="66" fill="white" opacity="0.7"/>
  <!-- Right three-point arc -->
  <path d="M 1140 340 L 980 340 L 980 520 L 1140 520" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <path d="M 980 340 Q 800 430 980 520" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <!-- Right key -->
  <rect x="980" y="360" width="160" height="160" fill="#8a2a00" opacity="0.6"/>
  <rect x="980" y="360" width="160" height="160" fill="none" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <!-- Right basket -->
  <rect x="1122" y="420" width="20" height="6" fill="#888"/>
  <circle cx="1112" cy="423" r="22" fill="none" stroke="#ff6600" stroke-width="5"/>
  <!-- Right backboard -->
  <rect x="1150" y="390" width="10" height="66" fill="white" opacity="0.7"/>
  <!-- Basketball -->
  <circle cx="600" cy="220" r="55" fill="#e05a00"/>
  <path d="M 545 220 Q 600 190 655 220" fill="none" stroke="#6a2a00" stroke-width="3"/>
  <path d="M 545 220 Q 600 250 655 220" fill="none" stroke="#6a2a00" stroke-width="3"/>
  <line x1="600" y1="165" x2="600" y2="275" stroke="#6a2a00" stroke-width="3"/>
  <line x1="545" y1="220" x2="655" y2="220" stroke="#6a2a00" stroke-width="3"/>
</svg>
