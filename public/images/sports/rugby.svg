<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2a0a"/>
      <stop offset="100%" style="stop-color:#1a4d1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Grass stripes -->
  <rect x="0" y="0" width="100" height="600" fill="#1e5c1e" opacity="0.5"/>
  <rect x="200" y="0" width="100" height="600" fill="#1e5c1e" opacity="0.5"/>
  <rect x="400" y="0" width="100" height="600" fill="#1e5c1e" opacity="0.5"/>
  <rect x="600" y="0" width="100" height="600" fill="#1e5c1e" opacity="0.5"/>
  <rect x="800" y="0" width="100" height="600" fill="#1e5c1e" opacity="0.5"/>
  <rect x="1000" y="0" width="100" height="600" fill="#1e5c1e" opacity="0.5"/>
  <!-- Pitch boundary -->
  <rect x="60" y="40" width="1080" height="520" fill="none" stroke="white" stroke-width="3" opacity="0.6"/>
  <!-- Try lines -->
  <line x1="60" y1="130" x2="1140" y2="130" stroke="white" stroke-width="2.5" opacity="0.6"/>
  <line x1="60" y1="470" x2="1140" y2="470" stroke="white" stroke-width="2.5" opacity="0.6"/>
  <!-- 22m lines -->
  <line x1="60" y1="210" x2="1140" y2="210" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="60" y1="390" x2="1140" y2="390" stroke="white" stroke-width="2" opacity="0.4"/>
  <!-- Halfway -->
  <line x1="60" y1="300" x2="1140" y2="300" stroke="white" stroke-width="2.5" opacity="0.6"/>
  <!-- Centre spot -->
  <circle cx="600" cy="300" r="6" fill="white" opacity="0.6"/>
  <!-- Halfway circle arc -->
  <path d="M 540 300 Q 600 260 660 300" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
  <!-- Left H-posts -->
  <line x1="560" y1="40" x2="560" y2="150" stroke="white" stroke-width="5" opacity="0.9"/>
  <line x1="640" y1="40" x2="640" y2="150" stroke="white" stroke-width="5" opacity="0.9"/>
  <line x1="560" y1="80" x2="640" y2="80" stroke="white" stroke-width="5" opacity="0.9"/>
  <!-- Left post base -->
  <line x1="600" y1="40" x2="600" y2="150" stroke="white" stroke-width="3" opacity="0.5"/>
  <!-- Right H-posts -->
  <line x1="560" y1="450" x2="560" y2="560" stroke="white" stroke-width="5" opacity="0.9"/>
  <line x1="640" y1="450" x2="640" y2="560" stroke="white" stroke-width="5" opacity="0.9"/>
  <line x1="560" y1="520" x2="640" y2="520" stroke="white" stroke-width="5" opacity="0.9"/>
  <line x1="600" y1="450" x2="600" y2="560" stroke="white" stroke-width="3" opacity="0.5"/>
  <!-- Rugby ball -->
  <ellipse cx="800" cy="200" rx="52" ry="32" fill="#8B4513" transform="rotate(-20 800 200)"/>
  <ellipse cx="800" cy="200" rx="52" ry="32" fill="none" stroke="#5a2d0c" stroke-width="2" transform="rotate(-20 800 200)"/>
  <!-- Ball lacing -->
  <line x1="786" y1="186" x2="814" y2="214" stroke="white" stroke-width="2" opacity="0.8"/>
  <line x1="779" y1="196" x2="807" y2="204" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="793" y1="178" x2="821" y2="222" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <!-- Ball seam -->
  <path d="M 752 193 Q 800 170 848 207" fill="none" stroke="white" stroke-width="2" opacity="0.5" transform="rotate(-20 800 200)"/>
</svg>
