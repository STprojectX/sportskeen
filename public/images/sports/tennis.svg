<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a7a"/>
      <stop offset="100%" style="stop-color:#0d2d50"/>
    </linearGradient>
    <linearGradient id="court" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2255aa"/>
      <stop offset="100%" style="stop-color:#1a3f88"/>
    </linearGradient>
    <linearGradient id="service" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e4e9e"/>
      <stop offset="100%" style="stop-color:#163a7c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Court surface -->
  <rect x="100" y="60" width="1000" height="480" fill="url(#court)" rx="2"/>
  <!-- Service boxes -->
  <rect x="100" y="60" width="500" height="230" fill="url(#service)" opacity="0.6"/>
  <rect x="600" y="310" width="500" height="230" fill="url(#service)" opacity="0.6"/>
  <!-- Court lines -->
  <!-- Outer boundary -->
  <rect x="100" y="60" width="1000" height="480" fill="none" stroke="white" stroke-width="4"/>
  <!-- Singles lines (inner) -->
  <rect x="175" y="60" width="850" height="480" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Baseline extension -->
  <line x1="100" y1="300" x2="1100" y2="300" stroke="white" stroke-width="2.5"/>
  <!-- Service line left -->
  <line x1="175" y1="195" x2="600" y2="195" stroke="white" stroke-width="2.5"/>
  <!-- Service line right -->
  <line x1="600" y1="405" x2="1025" y2="405" stroke="white" stroke-width="2.5"/>
  <!-- Centre service line -->
  <line x1="600" y1="60" x2="600" y2="540" stroke="white" stroke-width="2.5"/>
  <!-- Centre mark baseline -->
  <line x1="600" y1="55" x2="600" y2="75" stroke="white" stroke-width="3"/>
  <line x1="600" y1="525" x2="600" y2="545" stroke="white" stroke-width="3"/>
  <!-- Net -->
  <rect x="95" y="286" width="1010" height="28" fill="#888" rx="2"/>
  <line x1="95" y1="300" x2="1105" y2="300" stroke="white" stroke-width="3"/>
  <!-- Net posts -->
  <rect x="92" y="260" width="8" height="80" fill="#aaa" rx="2"/>
  <rect x="1100" y="260" width="8" height="80" fill="#aaa" rx="2"/>
  <!-- Net mesh lines -->
  <line x1="150" y1="288" x2="150" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="210" y1="288" x2="210" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="270" y1="288" x2="270" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="330" y1="288" x2="330" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="390" y1="288" x2="390" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="450" y1="288" x2="450" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="510" y1="288" x2="510" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="570" y1="288" x2="570" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="630" y1="288" x2="630" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="690" y1="288" x2="690" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="750" y1="288" x2="750" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="810" y1="288" x2="810" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="870" y1="288" x2="870" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="930" y1="288" x2="930" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="990" y1="288" x2="990" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="1050" y1="288" x2="1050" y2="314" stroke="#999" stroke-width="1" opacity="0.5"/>
  <!-- Tennis ball -->
  <circle cx="850" cy="180" r="28" fill="#ccee00"/>
  <path d="M 826 168 Q 850 155 874 168" fill="none" stroke="white" stroke-width="2.5"/>
  <path d="M 826 192 Q 850 205 874 192" fill="none" stroke="white" stroke-width="2.5"/>
</svg>
